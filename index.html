<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Analyzer</title>

    <!-- Standard Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

    <!-- Android Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">

    <!-- Apple iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- Mobile viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="checker-box">

        <h1>Password Analyzer</h1>

        <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter password">
            <button type="button" id="toggleBtn" aria-label="Toggle password visibility">
        <span id="eyeOpen">👁</span>
        <span id="eyeClosed" style="display:none;">🙈</span>
        </button>


        </div>

        

        <div class="strength-bar">
            <div id="strength-fill"></div>
        </div>

        <p class="entropy" id="entropy">Strength: —</p>

        <ul class="rules">
            <li id="length">❌ Minimum 8 characters</li>
            <li id="upper">❌ One uppercase letter</li>
            <li id="lower">❌ One lowercase letter</li>
            <li id="number">❌ One number</li>
            <li id="special">❌ One special character</li>
        </ul>

        <div class="result">
            <h3>Estimated Brute-Force Crack Time</h3>
            <p id="crack-time">—</p>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
